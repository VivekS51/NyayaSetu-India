name: NyayaSetu India CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # 1. Quality, Typecheck & Automated Test Suite
  # =========================================================================
  test-and-verify:
    name: Code Quality & Automated Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nyayasetu_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck Backend & Shared Types
        run: pnpm --filter @legal-marketplace/backend exec tsc --noEmit

      - name: Run Complete 112-Point Automated Integration Suite
        run: pnpm --filter @legal-marketplace/backend exec tsx test/run-all-tests.ts

      - name: Run Full 250-Test Jest Coverage Suite (Modules 1-10 & OWASP Top 10)
        run: pnpm --filter @legal-marketplace/backend run test:coverage

      - name: Run 200-Concurrent-User Performance Benchmark
        run: pnpm --filter @legal-marketplace/backend exec jest test/performance/load.test.ts

      - name: Verify Next.js Frontend Production Build
        run: pnpm --filter @legal-marketplace/frontend run build

  # =========================================================================
  # 2. Container Build & Security Vulnerability Scan
  # =========================================================================
  docker-security-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t nyayasetu-backend:latest -f apps/backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t nyayasetu-frontend:latest -f apps/frontend/Dockerfile .

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nyayasetu-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

