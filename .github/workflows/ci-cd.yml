name: NyayaSetu India CI/CD Pipeline

on:
  # Trigger manually from GitHub Actions tab once billing is active
  workflow_dispatch:
  # Uncomment below to re-enable automated runs on push:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]

jobs:
  # =========================================================================
  # Code Quality, Typecheck & Automated Test Suite (Zero Docker)
  # =========================================================================
  test-and-verify:
    name: Code Quality & Automated Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck Backend & Shared Types
        run: pnpm --filter @legal-marketplace/backend exec tsc --noEmit

      - name: Run Complete 112-Point Automated Integration Suite
        run: pnpm --filter @legal-marketplace/backend exec tsx test/run-all-tests.ts

      - name: Run Full Jest Test Suite (Modules 1-10 & OWASP Top 10)
        run: pnpm --filter @legal-marketplace/backend run test

      - name: Verify Next.js Frontend Production Build
        run: pnpm --filter @legal-marketplace/frontend run build
